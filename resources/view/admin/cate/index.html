<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>文章分类 - 后台管理系统</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" href="/static/admin/css/font.css">
  <link rel="stylesheet" href="/static/admin/css/weadmin.css">
</head>

<body>
  <div class="weadmin-nav">
    <span class="layui-breadcrumb">
      <a href="">首页</a>
      <a href="">文章管理</a>
      <a><cite>分类管理</cite></a>
    </span>
    <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right"
      href="javascript:location.replace(location.href);" title="刷新">
      <i class="layui-icon layui-icon-refresh"></i></a>
  </div>
  <div class="weadmin-body">
    <div class="weadmin-block">
      <button class="layui-btn" id="expand">全部展开</button>
      <button class="layui-btn" id="collapse">全部收起</button>
      <button class="layui-btn" onclick="WeAdminShow('添加分类','/admin/cate/create')"><i
          class="layui-icon layui-icon-add-circle-fine"></i>添加</button>
      <span class="fr" style="line-height:40px">共有数据：{{ count }} 条</span>
    </div>

    <div id="cate"></div>
  </div>

<script src="/static/admin/layui/layui.js" charset="utf-8"></script>
<script type="text/javascript">
var layout = [{
  name: '菜单名称',
  treeNodes: true,
  headerClass: 'value_col',
  colClass: 'value_col',
  style: 'width: 60%'
},
{
  name: '状态',
  headerClass: 'td-status',
  colClass: 'td-status',
  style: 'width: 10%',
  render: function () {
    return '<span class="layui-btn layui-btn-normal layui-btn-xs">已启用</span>';
  }
},
{
  name: '操作',
  headerClass: 'td-manage',
  colClass: 'td-manage',
  style: 'width: 20%',
  render: function (row) {
    return '<a onclick="node_stop(this,\'10001\')" href="javascript:;" title="启用"><i class="layui-icon">&#xe601;</i></a>' +
      '<a title="编辑" onclick="WeAdminShow(\'编辑\',\'./category-edit.html\')" href="javascript:;"><i class="layui-icon">&#xe642;</i></a>' +
      '<a title="删除" onclick="node_del(' + row.id + ')" href="javascript:;">\<i class="layui-icon">&#xe640;</i></a>';
  }
},
];

layui.config({
  base: '/static/admin/js/',
  version: '101100'
}).extend({
  admin: 'admin',
  treeGrid: 'extends/treeGrid'
});

layui.use(['treeGrid','admin', 'jquery', 'layer'], function () {
  var layer = layui.layer,
    $ = layui.jquery,
		admin = layui.admin,
    treeGrid = layui.treeGrid;

  var nodeTree = null;

  var renderList = function () {
    $.ajax({
      url: '/admin/cate/data',
      type: 'GET',
      data: {},
      success: function (res) {
        if (res.code === 0) {
          var initialData = res.data.list;
          var resultDate = initialData.map(function (item) {
            return Object.assign({}, item, { spread: true });
          });

          // 渲染树节点
          nodeTree = treeGrid({
            elem: '#cate'
            , spreadable: true //设置是否全展开，默认不展开
            , nodes: resultDate
            , layout: layout
          });
        } else {
          layer.msg(res.message, function () { });
        }
      }
    })
  }

  window.node_del = function (nodeId) {
    alert(nodeId);
  }
  /*分类-停用*/
  window.node_stop = function (obj, id) {
    var confirmTip;
    if ($(obj).attr('title') == '启用') {
      confirmTip = '确认要停用吗？';
    } else {
      confirmTip = '确认要启用吗？';
    }
    layer.confirm(confirmTip, function (index) {
      if ($(obj).attr('title') == '启用') {
        //发异步把用户状态进行更改
        $(obj).attr('title', '停用')
        $(obj).find('i').html('&#xe62f;');
        $(obj).parents("tr").find(".td-status").find('span').addClass('layui-btn-disabled').html('已停用');
        layer.msg('已停用!', {
          icon: 5,
          time: 1000
        });
      } else {
        $(obj).attr('title', '启用')
        $(obj).find('i').html('&#xe601;');

        $(obj).parents("tr").find(".td-status").find('span').removeClass('layui-btn-disabled').html('已启用');
        layer.msg('已启用!', {
          icon: 6,
          time: 1000
        });
      }
    });
  }

  $(function () {
    renderList();
  });

  $('#collapse').on('click', function () {
    layui.collapse(nodeTree);
  });

  $('#expand').on('click', function () {
    layui.expand(nodeTree);
  });
});
</script>
</body>

</html>
