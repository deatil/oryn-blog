<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>添加文章 - 后台管理系统</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" href="/static/admin/css/font.css">
  <link rel="stylesheet" href="/static/admin/css/weadmin.css">
</head>

<body>
  <div class="weadmin-body">
    <form id="form1" class="layui-form">
      <div class="layui-form-item">
        <label class="layui-form-label">文章分类</label>
        <div class="layui-input-block">
          <select name="cate_id">
            {% for cate in cates %}
            <option value="{{ cate.id }}">{{ cate.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="layui-form-item">
        <label class="layui-form-label">文章标题</label>
        <div class="layui-input-block">
          <input type="text" name="title" lay-verify="required" jq-error="请输入文章标题" placeholder="请输入文章标题"
            autocomplete="off" class="layui-input ">
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-input-block">
          <button class="layui-btn" lay-submit="" lay-filter="add">立即提交</button>
          <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
      </div>
    </form>
  </div>

<script src="/static/admin/layui/layui.js" charset="utf-8"></script>
<script type="text/javascript">
layui.config({
  base: '/static/admin/js/',
  version: '101100'
}).extend({
  admin: 'admin'
});

layui.use(['form', 'admin', 'jquery', 'layer'], function () {
  var layer = layui.layer,
    $ = layui.jquery,
    form = layui.form,
		admin = layui.admin;

  form.on('submit(add)', function (data) {
    $.ajax({
        url: "/admin/art/create",
        data: data.field,
        dataType:'json',
        type:'post',
        success:function(result) {
            if (result.code == 0) {
                layer.msg(result.message, {icon:1,time:1000}, function() {
                    parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("artList");
                });
            } else {
                layer.msg(result.message, {icon:2,time:1000});
            }
        }
    })
    return false;
  });

});
</script>
</body>

</html>
