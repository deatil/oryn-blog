<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>编辑文章 - 后台管理系统</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" href="/static/admin/css/font.css">
  <link rel="stylesheet" href="/static/admin/css/weadmin.css">
</head>

<body>
  <div class="weadmin-body">
    <form id="form1" class="layui-form">
      <div class="layui-tab">
        <ul class="layui-tab-title">
          <li class="layui-this">文章内容</li>
          <li>文章设置</li>
        </ul>
        <div class="layui-tab-content">
          <div class="layui-tab-item layui-show">
            <div class="layui-form-item">
              <label class="layui-form-label">文章分类</label>
              <div class="layui-input-block">
                <select name="cate_id">
                  {% for cate in cates %}
                    {% if data.cate_id == cate.id %}
                      <option value="{{ cate.id }}" selected="selected">{{ cate.name }}</option>
                    {% else %}
                      <option value="{{ cate.id }}">{{ cate.name }}</option>
                    {% endif %}
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="layui-form-item">
              <label class="layui-form-label">文章标题</label>
              <div class="layui-input-block">
                <input type="text" name="title" value="{{ data.title }}" lay-verify="required" jq-error="请输入文章标题" placeholder="请输入文章标题"
                  autocomplete="off" class="layui-input ">
              </div>
            </div>

            <div class="layui-form-item">
              <label class="layui-form-label">文章内容</label>
              <div class="layui-input-block">
                  <textarea name="content" id="content" placeholder="" class="layui-textarea">{{ data.content }}</textarea>
              </div>
            </div>

            <div class="layui-form-item">
              <label class="layui-form-label">关键字</label>
              <div class="layui-input-block">
                <input type="text" name="keywords" value="{{ data.keywords }}" lay-verify="required" 
                  jq-error="请输入文章关键字" 
                  placeholder="请输入文章关键字" autocomplete="off" class="layui-input ">
              </div>
            </div>
      
            <div class="layui-form-item">
              <label class="layui-form-label">文章描述</label>
              <div class="layui-input-block">
                  <textarea name="description" placeholder="" class="layui-textarea">{{ data.description }}</textarea>
              </div>
            </div>
          </div>
  
          <div class="layui-tab-item">
            <div class="layui-form-item">
              <label class="layui-form-label">文章标签</label>
              <div class="layui-input-inline">
                <input type="text" name="tags" value="{{ data.tags }}" 
                  placeholder="文章标签"
                  autocomplete="off" class="layui-input ">
              </div>
            </div>
      
            <div class="layui-form-item">
              <label class="layui-form-label">文章来源</label>
              <div class="layui-input-inline">
                <input type="text" name="from" value="{{ data.from }}" 
                  placeholder="文章来源"
                  autocomplete="off" class="layui-input ">
              </div>
            </div>

            <div class="layui-form-item">
              <label class="layui-form-label">阅读量</label>
              <div class="layui-input-inline">
                <input type="text" name="views" value="{{ data.views }}" 
                  placeholder="阅读量"
                  autocomplete="off" class="layui-input ">
              </div>
            </div>
      
            <div class="layui-form-item">
              <label class="layui-form-label">置顶</label>
              <div class="layui-input-inline">
                {% if data.is_top == '1' %}
                  <input type="radio" name="is_top" title="启用" value="1" checked />
                  <input type="radio" name="is_top" title="禁用" value="0" />
                {% else %}
                  <input type="radio" name="is_top" title="启用" value="1" />
                  <input type="radio" name="is_top" title="禁用" value="0" checked />
                {% endif %}
              </div>
            </div>
      
            <div class="layui-form-item">
              <label class="layui-form-label">状态</label>
              <div class="layui-input-inline">
                {% if data.status == '1' %}
                  <input type="radio" name="status" title="启用" value="1" checked />
                  <input type="radio" name="status" title="禁用" value="0" />
                {% else %}
                  <input type="radio" name="status" title="启用" value="1" />
                  <input type="radio" name="status" title="禁用" value="0" checked />
                {% endif %}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-input-block">
          <button class="layui-btn" lay-submit="" lay-filter="edit">立即提交</button>
          <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
      </div>
    </form>
  </div>

<script src="/static/admin/layui/layui.js" charset="utf-8"></script>
<script type="text/javascript">
layui.config({
  base: '/static/admin/js/',
  version: '101100'
}).extend({
  admin: 'admin'
});

layui.use(['form', 'admin', 'jquery', 'layer', 'layedit'], function () {
  var layer = layui.layer,
    $ = layui.jquery,
    form = layui.form,
    layedit = layui.layedit,
		admin = layui.admin;

  var edit = layedit.build('content');

  form.on('submit(edit)', function(data) {
    var content = layedit.getContent(edit);
    data.field["content"] = content;

    $.ajax({
        url: "/admin/art/edit?id={{ data.id }}",
        data: data.field,
        dataType: 'json',
        type: 'post',
        success: function(result) {
            if (result.code == 0) {
                layer.msg(result.message, {icon:1,time:1000}, function() {
                    parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("artList");
                });
            } else {
                layer.msg(result.message, {icon:2,time:1000});
            }
        }
    });

    return false;
  });

});
</script>
</body>

</html>
