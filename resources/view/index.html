<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Board</title>
    <link rel="stylesheet icon" href="/static/topic/img/favicon.ico" />
</head>

<body>
    <h1>
        Board!
    </h1>

    <div>
        <a href="/add">Add</a> 
        <span>count: {{ count }}</span>
    </div>

    <div>
        <ul>
            {% for d in data %}
            <li>
                title: <a href="/view/{{d.id}}">{{d.title}}</a>
                <a href="/edit/{{d.id}}">edit</a>
                <a href="/del/{{d.id}}">del</a>
                <br/>
                content: {{d.content}}
                <br/>
                time: {{ time_format(d.add_time) }}
                <br/>
            </li>
            {% endfor %}
        </ul>

    </div>
</body>
